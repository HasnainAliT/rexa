# Config for Module 3: Support & Contradiction classifier
# 3-way classification of adjacent sentence pair relations.

module: support_contradiction
backend: sklearn   # sklearn | transformers

sklearn:
  max_features: 2500
  ngram_range: [1, 2]
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 3

transformers:
  enabled: false
  model_name: distilbert-base-uncased
  max_length: 96
  learning_rate: 2.0e-5
  num_train_epochs: 4
  batch_size: 8

data:
  train_split: train
  val_split: val
  test_split: test

output:
  checkpoint_dir: checkpoints/support_contradiction
  metrics_file: checkpoints/support_contradiction/metrics.json

labels:
  - Supports
  - Contradicts
  - Neutral
