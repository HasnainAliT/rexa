# Config for Module 4: Reasoning Depth regressor
# Predicts a continuous [0, 1] reasoning-depth score from raw answer text.

module: reasoning_depth
backend: sklearn   # sklearn | transformers

sklearn:
  max_features: 3000
  ngram_range: [1, 2]
  n_estimators: 200
  max_depth: 8

transformers:
  enabled: false
  model_name: distilbert-base-uncased
  max_length: 256
  learning_rate: 2.0e-5
  num_train_epochs: 4
  batch_size: 8

data:
  train_split: train
  val_split: val
  test_split: test

output:
  checkpoint_dir: checkpoints/reasoning_depth
  metrics_file: checkpoints/reasoning_depth/metrics.json

target_range: [0.0, 1.0]
